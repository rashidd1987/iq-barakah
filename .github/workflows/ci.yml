name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile and PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ACTIVE/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ACTIVE/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build PWA
        run: npm run build:pwa

      - name: Upload PWA build
        uses: actions/upload-artifact@v4
        with:
          name: iq-barakah-pwa-${{ github.sha }}
          path: ACTIVE/mobile/dist-pwa
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile active services
        run: |
          python -m compileall -q bot_v2
          python -m compileall -q report_bot
          if [ -f ACTIVE/pwa_api/main.py ]; then
            python -m py_compile ACTIVE/pwa_api/main.py
          fi

      - name: Run report bot tests
        run: python -m unittest discover -s report_bot -p "test_*.py"

  release-safety:
    name: Release safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dual approval invariants
        run: python -m unittest report_bot.test_release_safety
