name: Build mobile release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read

concurrency:
  group: mobile-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS ${{ inputs.platform }} ${{ inputs.profile }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ACTIVE/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ACTIVE/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Request owner approval in Telegram
        if: inputs.profile == 'production'
        working-directory: ${{ github.workspace }}
        env:
          APPROVAL_API_URL: ${{ secrets.APPROVAL_API_URL }}
          APPROVAL_API_SECRET: ${{ secrets.APPROVAL_API_SECRET }}
        run: |
          python3 .github/scripts/wait_for_telegram_approval.py \
            --project "IQ Barakah" \
            --action "Запустить production-сборку мобильного приложения" \
            --description "Запустить облачную EAS-сборку выбранной мобильной платформы" \
            --risk "Будет создан официальный release-кандидат для публикации" \
            --idempotency-key "mobile-production:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-minutes 60

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Start cloud build
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive
