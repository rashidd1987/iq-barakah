name: Release PWA

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      confirm_production:
        description: Type RELEASE only for production
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pwa-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ACTIVE/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ACTIVE/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build PWA
        run: npm run build:pwa

      - name: Upload immutable build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-release-${{ github.sha }}
          path: ACTIVE/mobile/dist-pwa
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy ${{ inputs.target }}
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 90
    steps:
      - name: Require explicit production confirmation
        if: inputs.target == 'production' && inputs.confirm_production != 'RELEASE'
        run: |
          echo "Production release requires confirm_production=RELEASE."
          exit 1

      - name: Request owner approval in Telegram
        if: inputs.target == 'production'
        env:
          APPROVAL_API_URL: ${{ secrets.APPROVAL_API_URL }}
          APPROVAL_API_SECRET: ${{ secrets.APPROVAL_API_SECRET }}
        run: |
          python3 .github/scripts/wait_for_telegram_approval.py \
            --project "IQ Barakah" \
            --action "Опубликовать PWA в production" \
            --description "Загрузить проверенную сборку PWA на основной сайт" \
            --risk "Пользователи сразу увидят новую версию; возможен откат релиза" \
            --idempotency-key "pwa-production:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --ttl-minutes 60

      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: pwa-release-${{ github.sha }}
          path: dist-pwa

      - name: Validate deployment target
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$HEALTHCHECK_URL"
          case "${DEPLOY_PORT:-22}" in
            *[!0-9]*) echo "DEPLOY_PORT must be numeric."; exit 1 ;;
          esac
          case "$DEPLOY_PATH" in
            */pwa|*/pwa/) ;;
            *) echo "DEPLOY_PATH must end with /pwa because this build uses /pwa asset URLs."; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload PWA
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${DEPLOY_PORT:-22}" \
            dist-pwa/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify public URL
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "$HEALTHCHECK_URL"
